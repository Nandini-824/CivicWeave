services:
  db:
    image: postgis/postgis:16-3.4
    container_name: civicweave_db
    environment:
      POSTGRES_USER: civicweave
      POSTGRES_PASSWORD: civicweave123
      POSTGRES_DB: civicweave
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U civicweave -d civicweave"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
